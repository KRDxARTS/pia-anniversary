<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Multi-Página</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff5f6;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .admin-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #ff758c; margin-bottom: 25px; }
        
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #636e72;
            margin-bottom: 5px;
            font-weight: 500;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffb8c6;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            background: #fffafa;
        }
        
        button {
            background: #ff758c;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: 600;
            margin-top: 10px;
        }
        button:hover { background: #ff5e78; transform: translateY(-2px);}
        button:disabled { background: #ffb8c6; cursor: not-allowed; }

        #status { margin-top: 15px; font-size: 0.9rem; min-height: 20px;}

        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }

        /* --- GALLERY SECTION --- */
        .admin-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }
        .admin-thumb {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            height: 100px;
        }
        .admin-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(255, 71, 87, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px; height: 26px;
            font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Panel de Control 💌</h2>
        
        <div class="form-group">
            <label>Seleccionar Destino:</label>
            <select id="page-selector">
                <option value="images">Página 1 (Rosa)</option>
                <option value="page2_images">Página 2 (Medianoche)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Subir nueva foto:</label>
            <input type="file" id="image-input" accept="image/*">
        </div>

        <button id="upload-btn">Subir a la Galería</button>
        <p id="status"></p>

        <hr>

        <h3 style="font-weight: 500; font-size: 1.1rem; margin-bottom: 10px;">Gestionar Fotos Existentes</h3>
        <div class="admin-gallery" id="admin-gallery">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // PEGA TUS LLAVES AQUÍ
        const firebaseConfig = {
            apiKey: "AIzaSyAJ00HQmAPHqSR0bE3ffc1b51ekP-qUS6U",
            authDomain: "pia-gallery.firebaseapp.com",
            projectId: "pia-gallery",
            storageBucket: "pia-gallery.firebasestorage.app",
            messagingSenderId: "668426441929",
            appId: "1:668426441929:web:417f00314ad4c74816a918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const pageSelector = document.getElementById('page-selector');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('image-input');
        const statusText = document.getElementById('status');
        const galleryContainer = document.getElementById('admin-gallery');

        // FUNCIÓN: Cargar la galería según la página seleccionada
        async function loadAdminGallery() {
            const currentCollection = pageSelector.value;
            galleryContainer.innerHTML = '<p style="grid-column: 1/-1; font-size: 0.8rem;">Cargando...</p>';
            
            try {
                const q = query(collection(db, currentCollection), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                galleryContainer.innerHTML = '';
                
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const docId = documentSnap.id;
                    const imageUrl = data.url;
                    
                    const thumb = document.createElement('div');
                    thumb.className = 'admin-thumb';
                    thumb.innerHTML = `
                        <img src="${imageUrl}">
                        <button class="delete-btn" data-id="${docId}" data-url="${imageUrl}">✖</button>
                    `;
                    galleryContainer.appendChild(thumb);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = handleDelete;
                });
            } catch (e) {
                galleryContainer.innerHTML = '<p>Sin fotos aún.</p>';
            }
        }

        // FUNCIÓN: Eliminar
        async function handleDelete(e) {
            if(!confirm("¿Eliminar permanentemente?")) return;
            const btn = e.target;
            const docId = btn.getAttribute('data-id');
            const imageUrl = btn.getAttribute('data-url');
            const currentCollection = pageSelector.value;

            try {
                try { await deleteObject(ref(storage, imageUrl)); } catch(err) {}
                await deleteDoc(doc(db, currentCollection, docId));
                btn.parentElement.remove();
            } catch (err) { alert("Error al eliminar"); }
        }

        // ACCIÓN: Al cambiar de página en el menú
        pageSelector.onchange = loadAdminGallery;

        // ACCIÓN: Subir Foto
        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            const targetCollection = pageSelector.value;

            if (!file) { statusText.innerText = "Selecciona un archivo"; return; }

            uploadBtn.disabled = true;
            statusText.innerText = "Subiendo... ⏳";

            try {
                const fileName = Date.now() + "_" + file.name;
                const storageRef = ref(storage, 'gallery/' + fileName);
                await uploadBytesResumable(storageRef, file);
                const url = await getDownloadURL(storageRef);

                await addDoc(collection(db, targetCollection), {
                    url: url,
                    createdAt: serverTimestamp()
                });

                statusText.innerText = "¡Éxito! 🎉";
                fileInput.value = "";
                loadAdminGallery();
            } catch (e) {
                statusText.innerText = "Error al subir";
            } finally {
                uploadBtn.disabled = false;
            }
        };

        // Carga inicial
        loadAdminGallery();
    </script>
</body>
</html>
