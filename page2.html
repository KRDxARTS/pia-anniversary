<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti, Pia - Galería</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-midnight: #070810;
            --text-main: #FDFDFD;
            --text-muted: #B0B3C5;
            --accent-rose: #E8A5B2;
            --accent-gold: #DFCA97;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-midnight);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        /* --- STARRY MIDNIGHT BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: radial-gradient(circle at top right, #11142A 0%, var(--bg-midnight) 80%);
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, white, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 30% 50%, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 10%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 80%, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90% 90%, white, rgba(0,0,0,0));
            background-size: 200px 200px;
            opacity: 0.3;
            animation: twinkle 10s infinite alternate linear;
        }

        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -2;
            animation: float 20s infinite alternate ease-in-out;
        }

        .aurora-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: var(--accent-rose); }
        .aurora-2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: var(--accent-gold); animation-delay: -5s; }

        @keyframes float { 100% { transform: translate(5vw, 5vh) scale(1.1); } }
        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.5; } }

        /* --- MUSIC WIDGET --- */
        #music-widget {
            position: fixed;
            top: 30px; right: 30px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            padding: 10px 20px; border-radius: 50px;
            border: 1px solid var(--card-border);
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        
        .eq-bars { display: flex; gap: 3px; height: 16px; align-items: flex-end; }
        .eq-bars span { width: 2px; background: var(--accent-gold); animation: eq 0.8s ease-in-out infinite alternate; }
        .eq-bars span:nth-child(2) { animation-delay: 0.2s; }
        .eq-bars span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eq { 0% { height: 4px; } 100% { height: 16px; } }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; inset: 0;
            background: var(--bg-midnight);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        #splash-screen h2 {
            font-size: 2.8rem; font-style: italic; color: var(--text-main);
            margin-bottom: 40px; text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .enter-btn {
            background: transparent; color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 15px 40px; font-size: 1rem; font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px; text-transform: uppercase; border-radius: 40px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.4s ease;
        }

        .enter-btn:hover {
            background: var(--accent-gold); color: var(--bg-midnight);
            box-shadow: 0 0 30px rgba(223, 202, 151, 0.4);
        }

        /* --- HEADER --- */
        header { text-align: center; padding: 15vh 20px 5vh; position: relative; }
        header h1 { font-size: clamp(3.5rem, 8vw, 6rem); font-style: italic; margin-bottom: 20px; background: linear-gradient(to right, #fff, var(--accent-rose)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; line-height: 1.8; font-weight: 300; }

        /* --- HOVER-FOCUS GALLERY --- */
        .gallery-title { 
            text-align: center; font-size: 3.5rem; font-style: italic; 
            margin: 5vh 0 8vh; color: var(--text-main); 
            opacity: 0; transition: opacity 1s ease;
        }
        .gallery-title.reveal { opacity: 1; }
        
        .gallery {
            columns: 3 250px; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px 15vh;
        }

        .gallery:hover .gallery-item { opacity: 0.3; filter: grayscale(50%); }

        .gallery-item {
            break-inside: avoid; margin-bottom: 20px;
            border-radius: 8px; overflow: hidden; position: relative;
            opacity: 0; transform: translateY(30px); transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .gallery-item.reveal { opacity: 1; transform: translateY(0); }

        .gallery-item:hover {
            opacity: 1 !important; filter: grayscale(0%) !important;
            transform: scale(1.02) translateY(-5px); z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(223, 202, 151, 0.2);
        }

        .gallery-item img { width: 100%; display: block; }

        /* --- FINALE --- */
        .finale { 
            text-align: center; padding: 5vh 20px 15vh; 
            opacity: 0; transform: translateY(30px); transition: all 1s ease;
        }
        .finale.reveal { opacity: 1; transform: translateY(0); }
        .finale h2 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.5; font-style: italic; max-width: 900px; margin: 0 auto; color: var(--accent-rose); }

        /* --- NAVIGATION BUTTON (Back to Page 1) --- */
        .nav-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 40px;
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-midnight);
            box-shadow: 0 0 20px rgba(223, 202, 151, 0.3);
        }

        /* --- MAGIC CURSOR --- */
        .cursor-sparkle {
            position: fixed; pointer-events: none; z-index: 9999;
            width: 4px; height: 4px; background: white; border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-rose);
            animation: sparkle-fade 1s forwards;
        }
        @keyframes sparkle-fade { 100% { opacity: 0; transform: translateY(20px) scale(0); } }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .gallery { columns: 2 150px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="stars"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>

    <div id="music-widget">
        <div class="eq-bars"><span></span><span></span><span></span></div>
        <span style="font-size: 0.85rem; letter-spacing: 1px; color: var(--text-muted); font-family: 'Montserrat', sans-serif;">Pia's Song</span>
    </div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="splash-screen">
        <h2>Para ti, Pia.</h2>
        <button class="enter-btn" id="enter-btn">Abrir Galería</button>
    </div>

    <header>
        <h1 class="reveal-item">Nuestra Galería</h1>
        <p class="reveal-item">Una colección de todos nuestros hermosos recuerdos juntos.</p>
    </header>

    <section class="gallery" id="dynamic-gallery-2">
        </section>

    <div class="finale reveal-item">
        <h2 class="serif">Te amo, mi pequeña señorita.<br><br>Por siempre y para siempre te amaré hasta que muera, e incluso después de morir.</h2>
        <a href="index.html" class="nav-btn">Volver a la primera página</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // IMPORTANT: Paste your exact configuration here!
        const firebaseConfig = {
            apiKey: "AIzaSyAJ00HQmAPHqSR0bE3ffc1b51ekP-qUS6U",
            authDomain: "pia-gallery.firebaseapp.com",
            projectId: "pia-gallery",
            storageBucket: "pia-gallery.firebasestorage.app",
            messagingSenderId: "668426441929",
            appId: "1:668426441929:web:417f00314ad4c74816a918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- AUDIO & SPLASH SCREEN ---
        const enterBtn = document.getElementById('enter-btn');
        const splashScreen = document.getElementById('splash-screen');
        const bgMusic = document.getElementById('bg-music');
        const musicWidget = document.getElementById('music-widget');

        enterBtn.addEventListener('click', () => {
            let playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    musicWidget.style.opacity = '1';
                }).catch(error => {
                    console.log("Audio play failed: ", error);
                });
            }
            splashScreen.style.opacity = '0';
            setTimeout(() => { splashScreen.style.display = 'none'; }, 1200);
        });

        // --- SCROLL ANIMATION OBSERVER ---
        const observerOptions = { threshold: 0.15, rootMargin: '0px 0px -50px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    if(entry.target.classList.contains('gallery-item')) {
                        setTimeout(() => { entry.target.classList.add('reveal'); }, (index % 3) * 150);
                    } else {
                        entry.target.classList.add('reveal');
                    }
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Observe the static elements immediately
        document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));

        // --- FIREBASE GALLERY INJECTION ---
        async function loadGalleryTwo() {
            const galleryContainer = document.getElementById('dynamic-gallery-2');
            try {
                // Fetching specifically from "page2_images"
                const q = query(collection(db, "page2_images"), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    const imageUrl = doc.data().url; 
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'gallery-item';
                    
                    itemDiv.innerHTML = `<img src="${imageUrl}" loading="lazy" alt="Memory">`;
                    
                    galleryContainer.appendChild(itemDiv);
                    observer.observe(itemDiv);
                });
            } catch (error) {
                console.error("Error loading Firebase images for Page 2:", error);
            }
        }
        
        loadGalleryTwo();

        // --- MAGICAL SPARKLE CURSOR ---
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            let lastSparkleTime = 0;
            document.addEventListener('mousemove', (e) => {
                const now = Date.now();
                if (now - lastSparkleTime > 50) {
                    lastSparkleTime = now;
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('cursor-sparkle');
                    sparkle.style.left = e.clientX + 'px';
                    sparkle.style.top = e.clientY + 'px';
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => { sparkle.remove(); }, 1000);
                }
            });
        }
    </script>
</body>
</html>
